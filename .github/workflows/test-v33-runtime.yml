name: Independent v3.3 numeric behavior scenarios (LibreOffice)
on:
  push:
    branches: [audit/v33-independent-scenarios-20261029]
    paths: ['tools/test_v33_runtime.py', '.github/workflows/test-v33-runtime.yml']
  pull_request:
    paths: ['tools/test_v33_runtime.py', '.github/workflows/test-v33-runtime.yml']
permissions:
  contents: read
jobs:
  independent-behavior:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install cross-engine Calc for independent numerical verification
        shell: bash
        run: |
          if ! command -v libreoffice >/dev/null; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libreoffice-calc >/tmp/libreoffice-install.log 2>&1 || { tail -50 /tmp/libreoffice-install.log; exit 1; }
          fi
          libreoffice --version
      - name: Prepare separate nonfield and field scenario copies
        run: |
          python tools/test_v33_runtime.py --prepare "$RUNNER_TEMP/v33_scenarios"
      - name: Recalculate both copies (original release workbook never resaved)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v33_recalculated"
          timeout 240 libreoffice -env:UserInstallation=file://$RUNNER_TEMP/lo_v33_audit --headless --convert-to xlsx --outdir "$RUNNER_TEMP/v33_recalculated" "$RUNNER_TEMP/v33_scenarios/nonfield.xlsm" "$RUNNER_TEMP/v33_scenarios/field.xlsm"
          test -s "$RUNNER_TEMP/v33_recalculated/nonfield.xlsx"
          test -s "$RUNNER_TEMP/v33_recalculated/field.xlsx"
      - name: Verify 4 quarters across both employment modes and daily time exclusions
        run: |
          python tools/test_v33_runtime.py --verify "$RUNNER_TEMP/v33_recalculated"
