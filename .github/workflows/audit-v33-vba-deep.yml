name: Independent v3.3 VBA/OOXML forensic audit
on:
  push:
    branches: [audit/v33-deep-independent-20261029]
    paths: ['.github/workflows/audit-v33-vba-deep.yml', 'tools/audit_v33_daily_end_to_end.py']
permissions:
  contents: read
jobs:
  inspect-vba:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Inspect preserved original VBA and spreadsheet package
        shell: bash
        run: |
          python -m pip install -q oletools
          python - <<'PY'
          from oletools.olevba import VBA_Parser
          from pathlib import Path
          p=Path("2026초과v3.3.xlsm")
          v=VBA_Parser(str(p))
          print("VBA_HAS_MACROS",v.detect_vba_macros())
          for fn,stream,name,data in v.extract_macros():
              text=data.decode("utf-8","replace") if isinstance(data,bytes) else data
              print("==== VBA MODULE",name,"====")
              for i,line in enumerate(text.splitlines(),1):
                  print(f"VBA {name}:{i} {line}")
          v.close()
          PY
      - name: Inspect 2026 February date rows and cross-year templates
        shell: bash
        run: |
          python - <<'PY'
          from zipfile import ZipFile
          from xml.etree import ElementTree as ET
          p="2026초과v3.3.xlsm"
          ns={"x":"http://schemas.openxmlformats.org/spreadsheetml/2006/main"}
          with ZipFile(p) as z:
              root=ET.fromstring(z.read("xl/worksheets/sheet4.xml"))
              cells={c.attrib["r"]:c for c in root.findall(".//x:sheetData/x:row/x:c",ns)}
              for row in (27,28,29,30,31,32,33):
                  for col in "ABEFGH":
                      c=cells.get(f"{col}{row}")
                      if c is None: continue
                      f=c.find("x:f",ns);v=c.find("x:v",ns)
                      print("FEB_CELL",f"{col}{row}","type",c.get("t"),"formula",f.text if f is not None else None,"value",v.text if v is not None else None)
              ss=ET.fromstring(z.read("xl/sharedStrings.xml"))
              strings=["".join(si.itertext()) for si in ss]
              for row in (29,30):
                  c=cells.get(f"A{row}")
                  if c is not None and c.get("t")=="s":
                      print("FEB_SHARED_STRING",row,strings[int(c.find("x:v",ns).text)])
          PY
  numeric-attendance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install independent Calc engine
        shell: bash
        run: |
          if ! command -v libreoffice >/dev/null; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libreoffice-calc python3-uno >/tmp/lo-install.log 2>&1 || { tail -60 /tmp/lo-install.log; exit 1; }
          fi
      - name: Start UNO and test exact user-entered times, weekday/holiday and meal recognition
        shell: bash
        run: |
          set -euo pipefail
          libreoffice -env:UserInstallation=file://$RUNNER_TEMP/lo_audit_v33_deep --headless --norestore --nodefault --nofirststartwizard --accept="socket,host=127.0.0.1,port=20270;urp;StarOffice.ServiceManager" >/tmp/lo-v33-deep.log 2>&1 &
          LO_PID=$!
          trap 'kill "$LO_PID" 2>/dev/null || true' EXIT
          timeout 220 /usr/bin/python3 tools/audit_v33_daily_end_to_end.py .
